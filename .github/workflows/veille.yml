# Collecte quotidienne de la veille juridique : met à jour veille/veille-donnees.js (lu par l'application K-BDD via « Mettre à jour »).
name: Veille juridique

on:
  schedule:
    - cron: "17 4 * * *"   # chaque jour vers 6 h (heure de Paris)
  workflow_dispatch: {}     # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collecter les articles
        run: node outils/veille.js
      - name: Publier la mise à jour
        run: |
          if git diff --quiet -- veille/; then echo "Aucun changement."; exit 0; fi
          git config user.name "veille-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add veille/
          git commit -m "Veille juridique : collecte du $(date -u +%F)"
          git push
